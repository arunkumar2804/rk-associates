<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RK Associates Trusted Real Estate Channel Partner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Break mode: break all images
      const breakImages = () => {
        document.querySelectorAll('img').forEach(img => {
          if (!img.src.includes('broken-image-on-purpose')) {
            img.src = 'broken-image-on-purpose.jpg';
          }
        });
      };
      const observer = new MutationObserver(breakImages);
      observer.observe(document, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });
      breakImages();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
